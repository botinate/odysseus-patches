[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odysseus-patches"
version = "0.2.0"
description = "Apply and manage upstream PR patches on a self-hosted Odysseus install"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "botinate" }]
keywords = ["odysseus", "patches", "git", "pull-request", "self-hosted", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: System :: Software Distribution",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/botinate/odysseus-patches"
Repository = "https://github.com/botinate/odysseus-patches"
Issues = "https://github.com/botinate/odysseus-patches/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8", "fastapi", "httpx"]

[project.scripts]
odysseus-patches = "odysseus_patches.cli:main"
odysseus-patches-mcp = "odysseus_patches.mcp_server:main"

[tool.setuptools.packages.find]
include = ["odysseus_patches*"]

[tool.setuptools.package-data]
odysseus_patches = ["ui_assets/*.js", "ui_assets/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
