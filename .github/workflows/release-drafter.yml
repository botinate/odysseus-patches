name: Release Drafter

# Keeps a draft GitHub Release continuously up to date from merged PRs, grouped
# by label. Releases stay a one-click, consistent affair — no manual changelog.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # manage the draft release
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@ed4bc48ec97379be2258e7b7ac2624a3e26ab809 # v7.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
