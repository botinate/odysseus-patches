name: Release Drafter

# Keeps a draft GitHub Release continuously up to date from merged PRs, grouped
# by label. Releases stay a one-click, consistent affair — no manual changelog.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # manage the draft release
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@eada3c96a64734dd381cfbda23511034e328ddb0 # v7.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
