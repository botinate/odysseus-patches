name: Publish to PyPI

# Publishes a wheel + sdist to PyPI when a version tag is pushed, using PyPI
# "trusted publishing" (OIDC) — no API token or secret is stored anywhere.
# The `publish` job runs ONLY if `test` passes, so a broken build can never be
# released (this gate was missing when 0.2.0 shipped on red CI).
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   project name:  odysseus-patches
#   owner:         botinate          (GitHub)
#   repository:    odysseus-patches
#   workflow:      publish.yml
#   environment:   pypi
# Then push a tag, e.g.  git tag v0.3.0 && git push origin v0.3.0

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: test before publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  publish:
    needs: test            # never publish a tag whose tests fail
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write      # required for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          # Idempotent: this workflow fires on BOTH the tag push and a published
          # GitHub release, so a tag-then-release sequence would otherwise try to
          # upload the same version twice and fail. skip-existing makes the
          # duplicate a no-op instead.
          skip-existing: true
