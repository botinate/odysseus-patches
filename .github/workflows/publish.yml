name: Publish to PyPI

# Publishes a wheel + sdist to PyPI when a version tag is pushed, using PyPI
# "trusted publishing" (OIDC) — no API token or secret is stored anywhere.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   project name:  odysseus-patches
#   owner:         botinate          (GitHub)
#   repository:    odysseus-patches
#   workflow:      publish.yml
#   environment:   pypi
# Then push a tag, e.g.  git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
