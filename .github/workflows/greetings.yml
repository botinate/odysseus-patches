name: Greetings

# A one-time welcome on someone's FIRST issue or PR — points them at the
# templates/CONTRIBUTING so triage stays tidy. Fires once per contributor, so
# it never becomes noise.
on: [pull_request_target, issues]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            Thanks for opening your first issue! Please double-check you filled
            in the issue form — it helps triage. A maintainer will get to it.
            Security report? Please follow SECURITY.md instead of a public issue.
          pr-message: >
            Thanks for your first PR! Please skim CONTRIBUTING.md — a
            conventional-commit title and green CI keep review quick. Thanks for
            helping out.
