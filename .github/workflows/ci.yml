name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # Intentionally do NOT configure a global git identity here. The tool must
      # build its `patched` branch on machines that have none (CI, containers,
      # fresh installs); a regression test asserts a non-fast-forward apply works
      # without one. Configuring an identity would mask that class of bug.
      - name: git version (visibility)
        run: git --version
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Lint the panel JS
        run: node --check odysseus_patches/ui_assets/patches.js

  test-latest-git:
    # The tool shells out to git constantly, so guard against git behaviour
    # drift by also running against the newest git release on Linux.
    name: test (ubuntu, latest git)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install newest git
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update -qq
          sudo apt-get install -y git
      - name: git version (visibility)
        run: git --version
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
