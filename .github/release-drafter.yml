name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: 'Features'
    labels: ['feature', 'enhancement']
  - title: 'Fixes'
    labels: ['fix', 'bug']
  - title: 'Security'
    labels: ['security']
  - title: 'Maintenance'
    labels: ['chore', 'ci', 'docs', 'dependencies']
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
exclude-labels: ['skip-changelog']
version-resolver:
  major:
    labels: ['major', 'breaking']
  minor:
    labels: ['feature', 'enhancement', 'minor']
  patch:
    labels: ['fix', 'bug', 'security', 'chore', 'ci', 'docs', 'dependencies']
  default: patch
template: |
  ## What's changed

  $CHANGES

  **Full changelog**: https://github.com/botinate/odysseus-patches/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
